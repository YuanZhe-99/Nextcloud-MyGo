# Checks every push and pull request natively on Windows x64 and ARM64: the Go checks of AGENTS.md, the
# SyncD build and the fast test tier. The server tier needs a Linux container and stays local (doc/en-us/ci.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
